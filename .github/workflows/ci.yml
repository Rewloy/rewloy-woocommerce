name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: bin/lint

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit

  package:
    name: Zip and translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: The Turkish catalogue covers exactly what the code says
        run: |
          command -v xgettext >/dev/null || sudo apt-get install -y --no-install-recommends gettext
          bin/make-pot
          msgcmp --use-untranslated languages/rewloy-for-woocommerce-tr_TR.po languages/rewloy-for-woocommerce.pot
          msgfmt --check --output-file=/dev/null languages/rewloy-for-woocommerce-tr_TR.po

      - name: Build the WordPress.org zip
        run: bin/build-zip build
